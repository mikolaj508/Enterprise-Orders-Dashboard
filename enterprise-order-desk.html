<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enterprise Order Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#E5EAF0; --ink:#26313D; --ink-2:#56626F; --ink-3:#8A95A1; --line:#D3DAE2;
  --sh-d:rgba(160,174,192,.55); --sh-l:rgba(255,255,255,.95);
  --accent:#2C7A96; --accent-2:#23677F; --accent-ink:#FFFFFF;
  --new:#E0A21B; --danger:#C4513C; --vip:#7F55C2;
  --st-oos:#D0543E; --st-nogso:#D38A1C; --st-informed:#3A78C2; --st-awaiting:#23945C; --st-other:#7C8792; --st-none:#AEB7C1;
  --raise:7px 7px 16px var(--sh-d),-7px -7px 16px var(--sh-l);
  --raise-sm:3px 3px 8px var(--sh-d),-3px -3px 8px var(--sh-l);
  --inset:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l);
  --inset-sm:inset 2px 2px 4px var(--sh-d),inset -2px -2px 4px var(--sh-l);
  --r:18px; --r-sm:11px;
  --f:"Figtree","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#262C33; --ink:#E1E6EB; --ink-2:#AAB4BE; --ink-3:#7D8893; --line:#343C45;
    --sh-d:rgba(12,15,19,.6); --sh-l:rgba(58,66,76,.55);
    --accent:#5BB3D1; --accent-2:#7CC5DE; --accent-ink:#0D1F26;
    --new:#EDB43F; --danger:#E27A66; --vip:#B593EE;
    --st-oos:#E27A66; --st-nogso:#E6A64A; --st-informed:#72A9E6; --st-awaiting:#43C585; --st-other:#98A3AE; --st-none:#5D6874;
  }
}
:root[data-theme="dark"]{
  --bg:#262C33; --ink:#E1E6EB; --ink-2:#AAB4BE; --ink-3:#7D8893; --line:#343C45;
  --sh-d:rgba(12,15,19,.6); --sh-l:rgba(58,66,76,.55);
  --accent:#5BB3D1; --accent-2:#7CC5DE; --accent-ink:#0D1F26;
  --new:#EDB43F; --danger:#E27A66; --vip:#B593EE;
  --st-oos:#E27A66; --st-nogso:#E6A64A; --st-informed:#72A9E6; --st-awaiting:#43C585; --st-other:#98A3AE; --st-none:#5D6874;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.muted{color:var(--ink-3)}
small{font-size:12px;color:var(--ink-3)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;padding:24px 32px 8px;max-width:1680px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;min-width:0}
.brand h1{margin:0;font-weight:700;font-size:23px;line-height:1;letter-spacing:-.01em}
.brand p{margin:0;font-size:13px;color:var(--ink-3)}
.top-actions{margin-left:auto;display:flex;gap:12px;align-items:center}
.tabs{order:3;display:inline-flex;gap:4px;padding:6px;border-radius:16px;box-shadow:var(--inset);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:box-shadow .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--bg);box-shadow:var(--raise-sm)}
.tabs .n{display:inline-block;min-width:20px;margin-left:7px;font-size:12px;font-weight:600;color:var(--ink-3)}
.tabs .n.hot{color:var(--new)}

.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--bg);border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;line-height:1.2;box-shadow:var(--raise-sm);color:var(--ink);transition:box-shadow .12s}
.btn:hover{color:var(--accent)}
.btn:active{box-shadow:var(--inset-sm)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);color:var(--accent-ink)}
.btn.warn{color:var(--danger)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}

main{padding:20px 32px 48px;max-width:1680px;margin:0 auto}
.modenote{margin:0 auto;max-width:1680px;padding:4px 32px;font-size:12.5px;color:var(--ink-3)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-bottom:20px}
.toolbar .ttl{font-weight:700;font-size:19px}
.seg{display:inline-flex;padding:5px;gap:3px;border-radius:14px;box-shadow:var(--inset);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-3)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--raise-sm)}
.seg button .c{margin-left:6px;font-size:12px;font-weight:500;opacity:.8}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;align-items:center}
.filters input[type=search]{width:250px;max-width:100%}
input[type=search],input[type=text],input[type=number],select,textarea{background:var(--bg);border:0;border-radius:var(--r-sm);padding:9px 13px;font-size:14px;min-width:0;box-shadow:var(--inset-sm);color:var(--ink)}
select{cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
textarea{resize:vertical;width:100%;line-height:1.45}

/* notices */
#notices{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px}
#notices:empty{display:none}
.notice{flex:1 1 420px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;border-radius:var(--r-sm);box-shadow:var(--raise-sm);font-size:14px}
.notice::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--danger);flex:none}
.notice.newn::before{background:var(--new)}
.notice .grow{flex:1;min-width:220px;color:var(--ink-2)}
.notice .grow b{color:var(--ink)}

.bulkbar{position:sticky;top:10px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;margin-bottom:14px;background:var(--bg);border-radius:var(--r-sm);box-shadow:var(--raise)}
.bulkbar[hidden]{display:none}
.bulkbar strong{margin-right:8px;color:var(--accent)}

/* table */
.tablewrap{border-radius:var(--r);box-shadow:var(--raise);overflow:auto;max-height:calc(100dvh - 270px);min-height:260px;padding:6px 10px 10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-3);padding:12px 12px 10px;white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
th .arr{color:var(--accent)}
td{padding:11px 12px;vertical-align:top;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--sh-l) 45%,transparent)}
tbody tr td:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px}
tbody tr td:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}
tr.is-missing td{color:var(--ink-3)}
tr.is-missing .ordno{text-decoration:line-through;text-decoration-color:var(--danger)}
td.num,th.num{text-align:right;white-space:nowrap}
td.num small{display:block}
td.ck,th.ck{width:34px;padding-right:0}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
td.mpn{font-weight:600;white-space:nowrap}
.ordno{font-weight:700;white-space:nowrap}
td.com{max-width:320px;min-width:180px;color:var(--ink-2)}
td.com .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.cust small{display:block}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;line-height:1.6;white-space:nowrap;box-shadow:var(--inset-sm)}
.b-new{color:#8A5E00;background:color-mix(in srgb,var(--new) 22%,var(--bg))}
.b-miss{color:var(--danger)}
.b-wait{color:var(--st-informed)}
.b-add{color:var(--ink-2)}
.b-vip{color:var(--vip)}
:root[data-theme="dark"] .b-new{color:var(--new)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-new{color:var(--new)}}
.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 11px 3px 9px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:var(--raise-sm);color:var(--ink-2)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.awaiting{background:var(--st-awaiting);color:#fff}
.chip.awaiting::before{background:#fff}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:14px 6px 0;font-size:13px;color:var(--ink-3)}
.foot b{color:var(--ink)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.item{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:var(--inset-sm)}
.item b{font-weight:700;color:var(--accent)}
.rowacts{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.rowacts .btn:not(.primary){box-shadow:none;background:transparent}
.rowacts .btn:not(.primary):hover{box-shadow:var(--raise-sm)}

/* empty */
.empty{max-width:600px;margin:50px auto;text-align:center;padding:44px 32px;border-radius:26px;box-shadow:var(--raise)}
.empty h2{font-weight:700;font-size:25px;line-height:1.2;margin:0 0 10px}
.empty p{color:var(--ink-2);margin:0 0 18px}
.empty ol{text-align:left;display:inline-block;margin:0 0 20px;color:var(--ink-2);padding-left:20px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,40,52,.22);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(480px,calc(100% - 24px));background:var(--bg);border-radius:24px;box-shadow:-10px 0 34px rgba(20,30,45,.22);transform:translateX(110%);transition:transform .22s ease;z-index:21;display:flex;flex-direction:column;overflow:hidden}
#drawer.on{transform:none}
.dr-head{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 14px}
.dr-head h2{margin:0;font-weight:700;font-size:21px;line-height:1.2}
.dr-head p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px}
.x{margin-left:auto;border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-2);box-shadow:var(--raise-sm);flex:none}
.x:active{box-shadow:var(--inset-sm)}
.dr-body{overflow:auto;padding:8px 24px 28px;display:flex;flex-direction:column;gap:22px}
.dr-sec h3{margin:0 0 10px;font-weight:600;font-size:13px;color:var(--ink-3)}
.dr-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px;border-radius:var(--r-sm);box-shadow:var(--inset)}
.dr-line .mpn{font-weight:700;font-size:18px}
.dr-line .rev{font-weight:700;font-size:18px;color:var(--accent)}
.flags{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.flag{padding:9px 13px 9px 30px;border-radius:var(--r-sm);box-shadow:var(--raise-sm);position:relative;color:var(--ink-2)}
.flag::before{content:"";position:absolute;left:13px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.flag.n::before{background:var(--new)} .flag.m::before{background:var(--danger)} .flag.v::before{background:var(--vip)}
.sibs{list-style:none;margin:0;padding:6px;border-radius:var(--r-sm);box-shadow:var(--inset)}
.sibs li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 10px;font-size:13.5px;align-items:center;border-radius:9px}
.sibs li + li{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sibs .sc{grid-column:1/-1;color:var(--ink-2)}
.tpls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tpl{border:0;background:var(--bg);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;text-align:left;box-shadow:var(--raise-sm);color:var(--ink-2)}
.tpl:hover{color:var(--accent)}
.tpl:active{box-shadow:var(--inset-sm)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-3);min-width:0}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:12.5px;color:var(--ink-3);font-weight:400}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}

/* dialog */
dialog{border:0;border-radius:24px;padding:0;background:var(--bg);color:var(--ink);box-shadow:0 20px 50px rgba(20,30,45,.28);width:min(620px,calc(100% - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(30,40,52,.3)}
.dlg{padding:26px 28px;display:flex;flex-direction:column;gap:16px;overflow:auto;max-height:calc(100dvh - 40px)}
.dlg h2{margin:0;font-weight:700;font-size:21px;line-height:1.2}
.dlg p{margin:0;color:var(--ink-2);font-size:14px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
.itemrows{display:flex;flex-direction:column;gap:8px}
.itemrow{display:grid;grid-template-columns:1fr 90px auto;gap:8px}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-sm);cursor:pointer;box-shadow:var(--raise-sm);color:var(--ink);font-weight:500}
.radios input{accent-color:var(--accent)}

/* import ledger */
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ledger > div{padding:16px 18px;border-radius:var(--r-sm);box-shadow:var(--raise-sm)}
.ledger .big{font-weight:700;font-size:38px;line-height:1;display:block;letter-spacing:-.02em}
.ledger .lbl{font-weight:600;font-size:13.5px}
.ledger .val{font-size:12.5px;color:var(--ink-3)}
.ledger .plus .big{color:var(--new)} .ledger .minus .big{color:var(--danger)} .ledger .tilde .big{color:var(--accent)}
details{border-radius:var(--r-sm);box-shadow:var(--inset-sm)}
details summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
details .mini{max-height:220px;overflow:auto;padding:0 8px 8px}
.mini table{font-size:13px}
.mini td{padding:5px 8px}
.progress{height:8px;border-radius:5px;box-shadow:var(--inset-sm);overflow:hidden}
.progress > span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;border-radius:5px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-bottom:26px}
.kpi{padding:18px 20px;border:0;border-radius:var(--r);background:var(--bg);box-shadow:var(--raise);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.kpi:hover .l{color:var(--accent)}
.kpi:active{box-shadow:var(--inset)}
.kpi .v{font-weight:700;font-size:32px;line-height:1.05;letter-spacing:-.02em}
.kpi .l{font-weight:600;font-size:13.5px;margin-top:6px;color:var(--ink-2)}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.kpi.alert .v{color:var(--danger)} .kpi.newk .v{color:var(--new)} .kpi.okk .v{color:var(--st-awaiting)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px}
.panel{border-radius:var(--r);box-shadow:var(--raise);padding:20px 22px}
.panel h3{margin:0 0 2px;font-weight:700;font-size:16px}
.panel .sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-3)}
.hbars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hbars li{display:grid;grid-template-columns:minmax(90px,34%) 1fr 128px;gap:12px;align-items:center;font-size:13.5px}
.hbars li[data-go]{cursor:pointer}
.hbars li[data-go]:hover .hb-label{color:var(--accent)}
.hb-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb-track{height:12px;border-radius:8px;box-shadow:var(--inset-sm);overflow:hidden;padding:2px}
.hb-bar{display:block;height:100%;background:var(--c);border-radius:6px;min-width:4px}
.hb-val{text-align:right;white-space:nowrap;font-weight:700}
.hb-val small{font-weight:400;margin-left:6px}
.linechart svg{width:100%;height:auto;display:block}
.linechart text{fill:var(--ink-3);font-size:12px;font-family:var(--f)}
.empty-note{color:var(--ink-3);font-size:14px;margin:8px 0}

#toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;z-index:40;align-items:center;pointer-events:none}
.toast{background:var(--bg);color:var(--ink);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(20,30,45,.25);max-width:min(560px,90vw)}
.toast.err{background:var(--danger);color:#fff}
#drop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px)}
#drop.on{display:flex}
#drop div{background:var(--bg);padding:34px 44px;border-radius:24px;box-shadow:var(--raise);font-weight:700;font-size:21px;color:var(--accent)}
.loading{padding:60px;text-align:center;color:var(--ink-3)}
.bk-sec{padding:16px 18px;border-radius:var(--r-sm);box-shadow:var(--raise-sm);display:flex;flex-direction:column;gap:10px}
.bk-sec h3{margin:0;font-size:15px;font-weight:700}
.bk-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 18px;font-size:13.5px;padding:12px 16px;border-radius:var(--r-sm);box-shadow:var(--inset-sm)}
.bk-grid .h{font-weight:600;color:var(--ink-3);font-size:12.5px}
.bk-grid .n{text-align:right;font-weight:600}
.pastebox{min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:13px}

@media (max-width:720px){
  .top{padding:16px 16px 4px}
  main{padding:16px 14px 44px}
  .modenote{padding:4px 16px}
  .filters{margin-left:0;width:100%}
  .filters input[type=search]{flex:1 1 100%;width:auto}
  .ledger{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .tablewrap{max-height:none}
  .kpis{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Enterprise Order Desk</h1><p id="lastImport">Loading data…</p></div>
  <div class="top-actions">
    <button class="btn" id="backupBtn" type="button">Backup</button>
    <button class="btn" id="exportBtn" type="button" hidden>Export to Excel</button>
    <label class="btn primary" for="fileIn">Upload report</label>
    <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="orders" aria-selected="true">Orders<span class="n" id="n-orders"></span></button>
    <button role="tab" data-tab="back" aria-selected="false">Waiting for stock<span class="n" id="n-back"></span></button>
    <button role="tab" data-tab="cust" aria-selected="false">Special customers<span class="n" id="n-cust"></span></button>
    <button role="tab" data-tab="dash" aria-selected="false">Dashboard</button>
    <button role="tab" data-tab="arch" aria-selected="false">Archive<span class="n" id="n-arch"></span></button>
  </nav>
</header>
<p class="modenote" id="modenote" hidden></p>
<main id="main"><div class="loading">Loading data…</div></main>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="drop"><div>Drop the report file here</div></div>
<datalist id="mpnList"></datalist>
<datalist id="custList"></datalist>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOC = "en-GB";
const eur0 = new Intl.NumberFormat(LOC, {style:"currency", currency:"EUR", maximumFractionDigits:0});
const eur2 = new Intl.NumberFormat(LOC, {minimumFractionDigits:2, maximumFractionDigits:2});
const int = new Intl.NumberFormat(LOC);
const pad = n => String(n).padStart(2, "0");
const isoLocal = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const todayISO = () => isoLocal(new Date());
const daysSince = iso => {
  if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return null;
  return Math.round((new Date(todayISO()+"T00:00:00") - new Date(iso.slice(0,10)+"T00:00:00")) / 864e5);
};
const fmtDT = iso => iso ? new Date(iso).toLocaleString(LOC, {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "";
const fmtD = iso => iso ? new Date(iso).toLocaleDateString(LOC, {day:"2-digit", month:"short", year:"numeric"}) : "";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const safeId = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 190);
const lineId = (o, m) => safeId("L_" + o + "_" + m);
const pl = (n, one, many) => `${int.format(n)} ${n === 1 ? one : many}`;
const normCust = s => String(s ?? "").trim().replace(/^0+(?=.)/, "").toUpperCase();

/* ---------- statuses ---------- */
const CAT = {
  oos:      {label:"Out of Stock",          c:"var(--st-oos)"},
  nogso:    {label:"No Group Sales Order",  c:"var(--st-nogso)"},
  informed: {label:"Sales Rep Informed",    c:"var(--st-informed)"},
  awaiting: {label:"Awaiting Shipment",     c:"var(--st-awaiting)"},
  other:    {label:"Other",                 c:"var(--st-other)"},
  none:     {label:"No comment",            c:"var(--st-none)"}
};
const CAT_ORDER = ["oos","nogso","informed","awaiting","other","none"];
const PICKABLE = ["oos","nogso","informed","awaiting","other"];
function classify(t) {
  const s = String(t || "").toLowerCase().trim();
  if (!s) return "none";
  if (/out\s*of\s*stock|no\s+stock|brak\s+stock/.test(s)) return "oos";
  if (/not\s+trans?fer+ed\s+to\s+group|group\s+sales\s+order|no\s+gso|brak\s+group/.test(s)) return "nogso";
  if ((/in\s*stock/.test(s) && /(resolved|not\s+sent)/.test(s)) || /awaiting\s+shipment|ready\s+to\s+ship|czeka\s+na\s+wysy/.test(s)) return "awaiting";
  if (/informed|poinformowan/.test(s)) return "informed";
  return "other";
}
const LEGACY = {nogroup:"nogso", noinfo:"informed", navi:"awaiting", case:"other", approval:"other"};
function catOf(l) {
  if (!l.statusManual) return classify(l.comment);
  const c = LEGACY[l.cat] || l.cat;
  return CAT[c] ? c : "other";
}
const extractApproval = t => { const m = /approval\s*:?\s*(\d{5,})/i.exec(t || ""); return m ? m[1] : ""; };
function extractTicket(t, orderNo) {
  t = t || "";
  const m = /case\s*number\s*:?\s*([A-Z0-9]{6,})/i.exec(t);
  if (m) return m[1];
  const ap = extractApproval(t);
  return (t.match(/\b\d{7,9}\b/g) || []).filter(n => n !== orderNo && n !== ap)[0] || "";
}
const DEFAULT_TEMPLATES = [
  "Out of Stock",
  "NO INFO: Not transferred to Group, Sales informed",
  "NO INFO: {ticket}, Sales informed",
  "In Stock, Resolved, not sent from Navi",
  "Case number: {ticket}, not processed",
  "{ticket}, approval {approval}"
];
const chip = k => `<span class="chip ${k === "awaiting" ? "awaiting" : ""}" style="--c:${(CAT[k]||CAT.other).c}">${esc((CAT[k]||CAT.other).label)}</span>`;

/* ---------- state ---------- */
const S = { lines:new Map(), backs:new Map(), custs:new Map(), meta:{}, ready:{open:false, arch:false, backs:false, custs:false, meta:false} };
const UI = { tab:"orders", filter:"all", cat:"", bu:"", age:"", cust:"", q:"", sort:{k:"orderDate", d:"desc"}, sel:new Set(),
             bq:"", cq:"", aq:"", csel:new Set(), archTab:"lines", shell:null, drawerId:null };
let db = null, downloads = null, mode = "connecting";
const templates = () => Array.isArray(S.meta.templates) ? S.meta.templates : DEFAULT_TEMPLATES;
const openLines = () => [...S.lines.values()].filter(l => l.state === "open");
const archLines = () => [...S.lines.values()].filter(l => l.state === "archived");
const waitingBacks = () => [...S.backs.values()].filter(b => b.state === "waiting");
const shippedBacks = () => [...S.backs.values()].filter(b => b.state !== "waiting");
let custIdx = new Map();
const rebuildCustIdx = () => { custIdx = new Map([...S.custs.values()].map(c => [normCust(c.customerNo), c])); };
const special = no => no ? custIdx.get(normCust(no)) || null : null;

/* ---------- persistence ---------- */
const LS_KEY = "eod.v1";
function saveLocal() {
  if (mode !== "local") return;
  try { localStorage.setItem(LS_KEY, JSON.stringify({lines:Object.fromEntries(S.lines), backs:Object.fromEntries(S.backs), custs:Object.fromEntries(S.custs), meta:S.meta})); } catch (e) {}
}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (d) { S.lines = new Map(Object.entries(d.lines || {})); S.backs = new Map(Object.entries(d.backs || {})); S.custs = new Map(Object.entries(d.custs || {})); S.meta = d.meta || {}; }
  } catch (e) {}
}
const chains = new Map(); let active = 0; const waiters = [];
async function slot() { while (active >= 4) await new Promise(r => waiters.push(r)); active++; }
function release() { active--; const w = waiters.shift(); if (w) w(); }
async function withRetry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const c = e && e.code;
      if ((c === "unavailable" || c === "resource_exhausted") && i < 5) { await sleep(350 * 2 ** i + Math.random() * 300); continue; }
      throw e;
    }
  }
}
let lastErrToast = 0;
function writeErr(e) {
  const c = e && e.code;
  if (Date.now() - lastErrToast < 3000) return;
  lastErrToast = Date.now();
  if (c === "quota_exceeded") toast("The database is full. Delete old items from the Archive to save new ones.", "err");
  else if (c === "invalid_argument") toast("You don't have permission to save changes in this app.", "err");
  else toast("Changes couldn't be saved. Check your connection and try again.", "err");
}
function queue(path, fn) {
  const prev = chains.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(async () => { await slot(); try { return await withRetry(fn); } finally { release(); } });
  chains.set(path, p);
  p.catch(writeErr);
  return p;
}
function persist(path, data) { if (db) return queue(path, () => db.doc(path).set(data)); saveLocal(); return Promise.resolve(); }
function persistDel(path) { if (db) return queue(path, () => db.doc(path).delete()); saveLocal(); return Promise.resolve(); }
function saveLine(l) { S.lines.set(l.id, l); schedule(); return persist("lines/" + l.id, l); }
function delLine(id) { S.lines.delete(id); schedule(); return persistDel("lines/" + id); }
function saveBack(b) { S.backs.set(b.id, b); schedule(); return persist("backorders/" + b.id, b); }
function delBack(id) { S.backs.delete(id); schedule(); return persistDel("backorders/" + id); }
function saveCust(c) { S.custs.set(c.id, c); rebuildCustIdx(); schedule(); return persist("customers/" + c.id, c); }
function delCust(id) { S.custs.delete(id); rebuildCustIdx(); schedule(); return persistDel("customers/" + id); }
function saveMeta(m) { S.meta = m; schedule(); return persist("meta/state", m); }
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

async function init() {
  bindGlobal();
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { downloads = null; }
  if (db) {
    mode = "db";
    let openM = new Map(), archM = new Map();
    const merge = () => { S.lines = new Map([...archM, ...openM]); schedule(); };
    const onErr = e => { if (e && e.code !== "revoked") toast("Lost connection to the database. Reload the page.", "err"); };
    db.collection("lines").where("state", "==", "open").onSnapshot(s => { openM = new Map(s.docs.map(d => [d.id, d.data()])); S.ready.open = true; merge(); }, onErr);
    db.collection("lines").where("state", "==", "archived").orderBy("archivedAt", "desc").limit(1000)
      .onSnapshot(s => { archM = new Map(s.docs.map(d => [d.id, d.data()])); S.ready.arch = true; merge(); }, onErr);
    db.collection("backorders").onSnapshot(s => { S.backs = new Map(s.docs.map(d => [d.id, d.data()])); S.ready.backs = true; schedule(); }, onErr);
    db.collection("customers").onSnapshot(s => { S.custs = new Map(s.docs.map(d => [d.id, d.data()])); rebuildCustIdx(); S.ready.custs = true; schedule(); }, onErr);
    db.doc("meta/state").onSnapshot(s => { S.meta = s.exists ? s.data() : {}; S.ready.meta = true; schedule(); }, onErr);
  } else {
    mode = "local";
    loadLocal(); rebuildCustIdx();
    S.ready = {open:true, arch:true, backs:true, custs:true, meta:true};
    const n = $("#modenote"); n.hidden = false;
    n.textContent = "Local mode: data is saved only in this browser. Open the published app on claude.ai to save it in the cloud.";
    schedule();
  }
}
const isReady = () => Object.values(S.ready).every(Boolean);

/* ---------- render loop ---------- */
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function render() {
  if (!isReady()) return;
  const open = openLines();
  const newN = open.filter(l => l.isNew).length;
  $("#n-orders").textContent = int.format(open.length);
  $("#n-orders").classList.toggle("hot", newN > 0);
  $("#n-back").textContent = waitingBacks().length;
  $("#n-cust").textContent = S.custs.size;
  $("#n-arch").textContent = archLines().length + shippedBacks().length;
  $("#exportBtn").hidden = !(open.length || S.backs.size || S.custs.size) || (!downloads && !!window.claude);
  const li = S.meta.lastImportAt;
  $("#lastImport").textContent = li ? `Last import ${fmtDT(li)}${S.meta.lastImportFile ? " from " + S.meta.lastImportFile : ""}` : "No imports yet";
  $$(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === UI.tab)));
  const mpns = new Set([...S.lines.values()].map(l => l.mpn)); S.backs.forEach(b => (b.items||[]).forEach(i => mpns.add(i.mpn)));
  $("#mpnList").innerHTML = [...mpns].sort().map(m => `<option value="${esc(m)}">`).join("");
  const custs = new Set([...S.lines.values()].map(l => l.customer).filter(Boolean));
  $("#custList").innerHTML = [...custs].sort().map(c => `<option value="${esc(c)}">`).join("");
  const main = $("#main");
  if (!S.lines.size && !S.backs.size && (UI.tab === "orders" || UI.tab === "dash" || UI.tab === "arch")) {
    if (UI.shell !== "empty") { main.innerHTML = emptyView(); UI.shell = "empty"; }
    return;
  }
  const views = {orders:[ordersShell, ordersBody], back:[backShell, backBody], cust:[custShell, custBody], dash:[null, dashBody], arch:[archShell, archBody]};
  const [shell, body] = views[UI.tab];
  if (UI.shell !== UI.tab) { main.innerHTML = shell ? shell() : `<div id="body"></div>`; UI.shell = UI.tab; }
  body();
}
function emptyView() {
  return `<div class="empty">
    <h2>Upload your first order report</h2>
    <p>The app remembers every line and, with each new report, shows what's new and what dropped off.</p>
    <ol><li>Upload an older file with a <b>Comment</b> column first: comments are carried over and categorised.</li>
    <li>Then upload the latest report: new orders are flagged as <b>New</b>.</li></ol><br>
    <label class="btn primary" for="fileIn">Choose .xlsx file</label>
    <p class="hint" style="margin-top:12px">You can also drag the file anywhere on the page.</p></div>`;
}

/* ---------- ORDERS ---------- */
function ordersShell() {
  const bus = [...new Set(openLines().map(l => l.bu).filter(Boolean))].sort();
  return `<section class="toolbar">
    <div class="seg" id="segF" role="group" aria-label="Filter">
      <button data-f="all">All<span class="c" data-c="all"></span></button>
      <button data-f="new">New<span class="c" data-c="new"></span></button>
      <button data-f="nocomment">No comment<span class="c" data-c="nocomment"></span></button>
      <button data-f="missing">Not in report<span class="c" data-c="missing"></span></button>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search order, MPN, customer, ticket" value="${esc(UI.q)}" aria-label="Search">
      <select id="fCat" aria-label="Status"><option value="">Any status</option>${CAT_ORDER.map(k => `<option value="${k}">${esc(CAT[k].label)}</option>`).join("")}</select>
      <select id="fCust" aria-label="Customer type"><option value="">All customers</option><option value="special">Special customers</option><option value="regular">Regular customers</option></select>
      <select id="fBu" aria-label="Business Unit"><option value="">Any BU</option>${bus.map(b => `<option>${esc(b)}</option>`).join("")}</select>
      <select id="fAge" aria-label="Order age"><option value="">Any age</option><option value="0-7">Up to 7 days</option><option value="8-30">8–30 days</option><option value="31-60">31–60 days</option><option value="61-90">61–90 days</option><option value="91-99999">Over 90 days</option></select>
    </div>
  </section>
  <div id="notices"></div>
  <div class="bulkbar" id="bulk" hidden></div>
  <div class="tablewrap"><table><thead><tr>
    <th class="ck"><input type="checkbox" id="ckAll" aria-label="Select visible"></th>
    <th data-sort="orderNo">Order</th><th data-sort="bu">BU</th><th data-sort="orderDate">Date</th>
    <th data-sort="mpn">MPN</th><th data-sort="customer">Customer</th><th data-sort="revenue" class="num">Revenue €</th>
    <th data-sort="cat">Status</th><th data-sort="comment">Comment</th><th data-sort="ticket">Ticket</th>
  </tr></thead><tbody id="tb"></tbody></table></div>
  <div class="foot" id="foot"></div>`;
}
function filterOrders() {
  const q = UI.q.trim().toLowerCase();
  let a = openLines();
  if (UI.filter === "new") a = a.filter(l => l.isNew);
  else if (UI.filter === "nocomment") a = a.filter(l => !l.comment);
  else if (UI.filter === "missing") a = a.filter(l => !l.inReport);
  if (UI.cat) a = a.filter(l => catOf(l) === UI.cat);
  if (UI.cust === "special") a = a.filter(l => special(l.customer));
  else if (UI.cust === "regular") a = a.filter(l => !special(l.customer));
  if (UI.bu) a = a.filter(l => l.bu === UI.bu);
  if (UI.age) { const [lo, hi] = UI.age.split("-").map(Number); a = a.filter(l => { const d = daysSince(l.orderDate); return d != null && d >= lo && d <= hi; }); }
  if (q) a = a.filter(l => [l.orderNo, l.mpn, l.customer, special(l.customer)?.name, l.comment, l.ticket, l.approval, l.ref, l.bu].some(v => String(v || "").toLowerCase().includes(q)));
  const {k, d} = UI.sort, dir = d === "asc" ? 1 : -1;
  a.sort((x, y) => {
    let vx = x[k], vy = y[k];
    if (k === "cat") { vx = CAT_ORDER.indexOf(catOf(x)); vy = CAT_ORDER.indexOf(catOf(y)); }
    if (typeof vx === "number" && typeof vy === "number") return (vx - vy) * dir;
    return String(vx ?? "").localeCompare(String(vy ?? ""), LOC, {numeric:true}) * dir || String(x.orderNo).localeCompare(String(y.orderNo), LOC, {numeric:true});
  });
  return a;
}
function orderIndex() {
  const byOrder = new Map();
  openLines().forEach(l => { if (!byOrder.has(l.orderNo)) byOrder.set(l.orderNo, []); byOrder.get(l.orderNo).push(l); });
  return {byOrder, waiting:new Set(waitingBacks().map(b => String(b.orderNo)))};
}
function ordersBody() {
  const open = openLines();
  const cnt = {all:open.length, new:open.filter(l => l.isNew).length, nocomment:open.filter(l => !l.comment).length, missing:open.filter(l => !l.inReport).length};
  $$("#segF button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === UI.filter)));
  $$("#segF [data-c]").forEach(s => s.textContent = cnt[s.dataset.c]);
  $("#fCat").value = UI.cat; $("#fBu").value = UI.bu; $("#fAge").value = UI.age; $("#fCust").value = UI.cust;
  $$("th[data-sort]").forEach(th => { th.querySelector(".arr")?.remove(); if (th.dataset.sort === UI.sort.k) th.insertAdjacentHTML("beforeend", ` <span class="arr">${UI.sort.d === "asc" ? "▲" : "▼"}</span>`); });

  const miss = open.filter(l => !l.inReport);
  let nh = "";
  if (miss.length) {
    const v = miss.reduce((s, l) => s + (l.revenue || 0), 0);
    nh += `<div class="notice"><span class="grow"><b>${pl(miss.length, "line is", "lines are")} not in the latest report</b> (${eur0.format(v)}). Most likely shipped or deleted.</span>
      <button class="btn small" data-act="showMissing">Show</button><button class="btn small" data-act="archMissing">Archive all…</button></div>`;
  }
  if (cnt.new) nh += `<div class="notice newn"><span class="grow"><b>${pl(cnt.new, "new line needs", "new lines need")} review.</b> The New flag disappears once you save a comment.</span><button class="btn small" data-act="showNew">Show new</button></div>`;
  $("#notices").innerHTML = nh;

  const rows = filterOrders();
  const {byOrder, waiting} = orderIndex();
  const visible = new Set(rows.map(r => r.id));
  [...UI.sel].forEach(id => { if (!visible.has(id)) UI.sel.delete(id); });
  $("#tb").innerHTML = rows.length ? rows.map(l => {
    const sib = byOrder.get(l.orderNo) || [];
    const age = daysSince(l.orderDate);
    const sp = special(l.customer);
    const cat = catOf(l);
    const b = [];
    if (l.isNew) b.push(`<span class="badge b-new">${l.returned ? "Returned" : "New"}</span>`);
    if (l.isNew && sib.some(s => s.id !== l.id && !s.isNew)) b.push(`<span class="badge b-add">new line in known order</span>`);
    if (!l.inReport) b.push(`<span class="badge b-miss">Not in report</span>`);
    if (waiting.has(String(l.orderNo))) b.push(`<span class="badge b-wait">Waiting for stock</span>`);
    return `<tr data-id="${esc(l.id)}" class="${l.isNew ? "is-new" : ""} ${!l.inReport ? "is-missing" : ""}" style="--c:${CAT[cat].c}">
      <td class="ck"><input type="checkbox" data-ck ${UI.sel.has(l.id) ? "checked" : ""} aria-label="Select ${esc(l.orderNo)} ${esc(l.mpn)}"></td>
      <td><span class="ordno">${esc(l.orderNo)}</span>${b.length ? `<div class="badges">${b.join("")}</div>` : ""}</td>
      <td>${esc(l.bu)}</td>
      <td class="num">${esc(l.orderDate)}${age != null ? `<small>${age} days</small>` : ""}</td>
      <td class="mpn">${esc(l.mpn)}</td>
      <td class="cust">${esc(l.customer)}${sp ? `<div class="badges"><span class="badge b-vip" title="Special customer: no project registration needed">Special${sp.name ? ": " + esc(sp.name) : ""}</span></div>` : ""}</td>
      <td class="num">${eur2.format(l.revenue || 0)}${l.prevRevenue != null ? `<small>was ${eur2.format(l.prevRevenue)}</small>` : ""}</td>
      <td>${chip(cat)}</td>
      <td class="com">${l.comment ? `<span class="t" title="${esc(l.comment)}">${esc(l.comment)}</span>` : `<span class="muted">—</span>`}</td>
      <td>${esc(l.ticket)}</td></tr>`;
  }).join("") : `<tr><td colspan="10" style="padding:30px;text-align:center;color:var(--ink-3)">No lines match these filters. <button class="linkbtn" data-act="clearF">Clear filters</button></td></tr>`;
  const sum = rows.reduce((s, l) => s + (l.revenue || 0), 0);
  $("#foot").innerHTML = `<span>${pl(rows.length, "line", "lines")} in ${pl(new Set(rows.map(r => r.orderNo)).size, "order", "orders")}</span><span>Visible total: <b>€${eur2.format(sum)}</b></span>`;
  const ckAll = $("#ckAll"); ckAll.checked = rows.length > 0 && rows.every(r => UI.sel.has(r.id)); ckAll.indeterminate = !ckAll.checked && rows.some(r => UI.sel.has(r.id));
  renderBulk();
}
function renderBulk() {
  const bar = $("#bulk"); if (!bar) return;
  const n = UI.sel.size;
  bar.hidden = !n;
  if (!n) return;
  bar.innerHTML = `<strong>${int.format(n)} selected</strong>
    <button class="btn small" data-act="bulkComment">Set comment</button>
    <button class="btn small" data-act="bulkSeen">Mark as reviewed</button>
    <button class="btn small" data-act="bulkBack">Add to Waiting for stock</button>
    <button class="btn small" data-act="bulkArch">Archive…</button>
    <button class="btn small" data-act="bulkClear">Clear selection</button>`;
}

/* ---------- drawer ---------- */
function tplButtons() { return templates().map((t, i) => `<button class="tpl" data-tpl="${i}" type="button">${esc(t)}</button>`).join(""); }
function openDrawer(id) {
  const l = S.lines.get(id); if (!l) return;
  UI.drawerId = id;
  const sib = openLines().filter(s => s.orderNo === l.orderNo && s.id !== l.id);
  const sp = special(l.customer);
  const d = $("#drawer");
  const flags = [];
  if (sp) flags.push(`<div class="flag v"><b>Special customer${sp.name ? ": " + esc(sp.name) : ""}.</b> No project registration needed.${sp.note ? " " + esc(sp.note) : ""}</div>`);
  if (l.isNew) flags.push(`<div class="flag n">${l.returned ? "This line came back to the report after being archived" : "New line from the import on " + fmtDT(l.firstSeen)}${sib.some(s => !s.isNew) ? ". You already know the other lines of this order." : ""}</div>`);
  if (!l.inReport) flags.push(`<div class="flag m">Not in the report since ${fmtDT(l.missingSince)}. Probably shipped or deleted.</div>`);
  if (l.prevRevenue != null) flags.push(`<div class="flag">Revenue changed from €${eur2.format(l.prevRevenue)} (${fmtD(l.revenueChangedAt)}).</div>`);
  const autoCat = classify(l.comment);
  d.innerHTML = `<div class="dr-head"><div><h2>Order ${esc(l.orderNo)}</h2><p>${esc(l.bu)}, customer ${esc(l.customer)}, ${esc(l.orderDate)}${daysSince(l.orderDate) != null ? ` (${daysSince(l.orderDate)} days)` : ""}</p></div><button class="x" data-act="closeDrawer" aria-label="Close">×</button></div>
  <div class="dr-body">
    <div class="dr-line"><span class="mpn">${esc(l.mpn)}</span><span class="rev">€${eur2.format(l.revenue || 0)}</span></div>
    ${flags.length ? `<div class="flags">${flags.join("")}</div>` : ""}
    ${sib.length ? `<section class="dr-sec"><h3>Other lines in this order</h3><ul class="sibs">${sib.map(s => `<li><span><b>${esc(s.mpn)}</b> ${chip(catOf(s))}</span><span>€${eur2.format(s.revenue || 0)}</span>
      ${s.comment ? `<span class="sc">${esc(s.comment)} <button class="linkbtn" data-copy="${esc(s.id)}">Use this comment</button></span>` : ""}</li>`).join("")}</ul></section>` : ""}
    <section class="dr-sec"><h3>Comment</h3>
      <div class="tpls">${tplButtons()}</div>
      <textarea id="dCom" rows="3" placeholder="Type a comment or pick a template">${esc(l.comment)}</textarea>
      <div class="grid2" style="margin-top:10px">
        <label class="field">Ticket / case<input type="text" id="dTicket" value="${esc(l.ticket)}"></label>
        <label class="field">Approval<input type="text" id="dAppr" value="${esc(l.approval)}"></label>
        <label class="field full">Status
          <select id="dCat"><option value="auto">Automatic from comment (${esc(CAT[autoCat].label)})</option>${PICKABLE.map(k => `<option value="${k}" ${l.statusManual && catOf(l) === k ? "selected" : ""}>${esc(CAT[k].label)}</option>`).join("")}</select></label>
      </div>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <span class="hint">Ctrl+Enter saves. <button class="linkbtn" data-act="manageTpl" type="button">Edit templates</button></span>
        <button class="btn primary" data-act="saveCom" type="button">Save comment</button>
      </div>
    </section>
    <section class="dr-sec"><h3>Actions</h3><div class="row">
      ${l.isNew ? `<button class="btn" data-act="seen">Mark as reviewed</button>` : ""}
      <button class="btn" data-act="toBack">Add to Waiting for stock</button>
      ${l.customer ? (sp ? `<button class="btn" data-act="unspecial">Remove from special customers</button>` : `<button class="btn" data-act="makeSpecial">Mark customer as special</button>`) : ""}
      <button class="btn warn" data-act="archOne">Archive…</button></div></section>
    <section class="dr-sec"><h3>Details</h3><dl class="kv">
      <dt>Your Reference</dt><dd>${esc(l.ref) || "—"}</dd>
      <dt>In the app since</dt><dd>${fmtDT(l.firstSeen) || "—"}</dd>
      <dt>Comment last changed</dt><dd>${fmtDT(l.commentedAt) || "—"}</dd></dl></section>
  </div>`;
  d.classList.add("on"); d.setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on");
  const ta = $("#dCom"), ticket = $("#dTicket"), appr = $("#dAppr"), sel = $("#dCat");
  let ticketTouched = !!l.ticket, apprTouched = !!l.approval;
  ticket.addEventListener("input", () => ticketTouched = true);
  appr.addEventListener("input", () => apprTouched = true);
  const onText = () => {
    const t = ta.value;
    sel.options[0].textContent = `Automatic from comment (${CAT[classify(t)].label})`;
    if (!ticketTouched) ticket.value = extractTicket(t, l.orderNo);
    if (!apprTouched) appr.value = extractApproval(t);
  };
  ta.addEventListener("input", onText);
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveComment(); } });
  $(".tpls", d).addEventListener("click", e => {
    const b = e.target.closest("[data-tpl]"); if (!b) return;
    const t = templates()[+b.dataset.tpl]; if (t == null) return;
    ta.value = fillTpl(t, ticket.value, appr.value); onText(); ta.focus();
  });
  $$("[data-copy]", d).forEach(b => b.addEventListener("click", () => {
    const s = S.lines.get(b.dataset.copy); if (!s) return;
    ta.value = s.comment; ticket.value = s.ticket || ""; appr.value = s.approval || ""; ticketTouched = apprTouched = true; onText();
  }));
  setTimeout(() => (l.comment ? $(".x", d) : ta).focus(), 50);
}
function fillTpl(t, ticket, appr) { return t.replace(/\{ticket\}/g, ticket || "{ticket}").replace(/\{approval\}/g, appr || "{approval}"); }
function closeDrawer() { const d = $("#drawer"); d.classList.remove("on"); d.setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("on"); UI.drawerId = null; }
function applyComment(l, text, {ticket, approval, cat} = {}) {
  l.comment = text;
  l.statusManual = !!(cat && cat !== "auto");
  l.cat = l.statusManual ? cat : classify(text);
  l.ticket = ticket != null ? ticket : extractTicket(text, l.orderNo);
  l.approval = approval != null ? approval : extractApproval(text);
  return l;
}
const hasPlaceholder = t => /\{ticket\}|\{approval\}/.test(t);
function saveComment() {
  const l0 = S.lines.get(UI.drawerId); if (!l0) return;
  const text = $("#dCom").value.trim();
  if (hasPlaceholder(text)) { toast("Fill in the number in the comment ({ticket} or {approval}).", "err"); return; }
  const l = applyComment(clone(l0), text, {ticket:$("#dTicket").value.trim(), approval:$("#dAppr").value.trim(), cat:$("#dCat").value});
  l.isNew = false; l.returned = false; l.commentedAt = new Date().toISOString();
  saveLine(l); toast("Comment saved"); closeDrawer();
}

/* ---------- line actions ---------- */
function markSeen(ids) { ids.forEach(id => { const l = S.lines.get(id); if (l && l.isNew) saveLine({...clone(l), isNew:false, returned:false}); }); }
function archiveDialog(ids, preset) {
  const ls = ids.map(id => S.lines.get(id)).filter(Boolean);
  if (!ls.length) return;
  const v = ls.reduce((s, l) => s + (l.revenue || 0), 0);
  openDlg(`<form class="dlg" id="archF"><h2>Archive ${pl(ls.length, "line", "lines")}</h2>
    <p>€${eur2.format(v)} in total. Lines move to the Archive with their comments. You can restore them at any time.</p>
    <div class="radios">
      <label><input type="radio" name="r" value="Shipped / sold" ${preset !== "manual" ? "checked" : ""}> Shipped / sold</label>
      <label><input type="radio" name="r" value="Deleted / cancelled"> Deleted / cancelled</label>
      <label><input type="radio" name="r" value="Closed manually" ${preset === "manual" ? "checked" : ""}> Closed manually</label></div>
    <label class="field">Note (optional)<input type="text" name="note"></label>
    <div class="acts"><button class="btn" type="button" data-act="closeDlg">Cancel</button><button class="btn primary" type="submit">Archive</button></div></form>`);
  $("#archF").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target), now = new Date().toISOString();
    ls.forEach(l => saveLine({...clone(l), state:"archived", archivedAt:now, archiveReason:f.get("r"), archiveNote:String(f.get("note") || ""), isNew:false}));
    ids.forEach(id => UI.sel.delete(id));
    closeDlg(); closeDrawer(); toast(`Archived ${pl(ls.length, "line", "lines")}`);

}
function bulkCommentDialog(ids) {
  openDlg(`<form class="dlg" id="bcF"><h2>Comment for ${pl(ids.length, "line", "lines")}</h2>
    <p>This comment replaces the current comments of the selected lines.</p>
    <div class="tpls">${tplButtons()}</div>
    <textarea id="bcC" rows="3" required></textarea>
    <div class="grid2"><label class="field">Ticket / case<input type="text" id="bcT"></label><label class="field">Approval<input type="text" id="bcA"></label>
      <label class="field full">Status<select id="bcS"><option value="auto">Automatic from comment</option>${PICKABLE.map(k => `<option value="${k}">${esc(CAT[k].label)}</option>`).join("")}</select></label></div>
    <div class="acts"><button class="btn" type="button" data-act="closeDlg">Cancel</button><button class="btn primary" type="submit">Save for ${int.format(ids.length)}</button></div></form>`);
  const ta = $("#bcC");
  $("#bcF .tpls").addEventListener("click", e => { const b = e.target.closest("[data-tpl]"); if (!b) return; ta.value = fillTpl(templates()[+b.dataset.tpl], $("#bcT").value, $("#bcA").value); ta.focus(); });
  $("#bcF").addEventListener("submit", e => {
    e.preventDefault();

    const t = $("#bcT").value.trim(), a = $("#bcA").value.trim(), cat = $("#bcS").value, now = new Date().toISOString();

function custBody() {
  const q = UI.cq.trim().toLowerCase();

function parseCustList(txt) {
  const seen = new Set(), out = [];
  String(txt).split(/[\r\n,;\t]+/).map(x => x.trim()).filter(x => x && !/customer/i.test(x)).forEach(x => { const k = normCust(x); if (!seen.has(k)) { seen.add(k); out.push(x); } });
  return out;
}
function pasteCustDialog() {
  openDlg(`<form class="dlg" id="pF"><h2>Paste customer numbers</h2>
    <p>One customer number per line (or separated by commas). Duplicates and numbers already on the list are skipped.</p>
    <textarea class="pastebox" id="pT" placeholder="26865&#10;27759&#10;28356"></textarea>
    <p class="hint" id="pH">&nbsp;</p>
    <div class="acts"><button class="btn" type="button" data-act="closeDlg">Cancel</button><button class="btn primary" type="submit" id="pGo" disabled>Add customers</button></div></form>`);
  const ta = $("#pT"), h = $("#pH"), go = $("#pGo");
  const upd = () => { const all = parseCustList(ta.value), fresh = all.filter(n => !special(n));
    h.textContent = all.length ? `${pl(fresh.length, "new customer", "new customers")}${all.length - fresh.length ? `, ${int.format(all.length - fresh.length)} already on the list` : ""}.` : "\u00a0";
    go.disabled = !fresh.length; go.textContent = fresh.length ? `Add ${pl(fresh.length, "customer", "customers")}` : "Add customers"; };
  ta.addEventListener("input", upd);
  $("#pF").addEventListener("submit", e => { e.preventDefault();
    const fresh = parseCustList(ta.value).filter(n => !special(n)), now = new Date().toISOString();
    fresh.forEach(no => saveCust({id:safeId("C_" + normCust(no)), customerNo:no, name:"", note:"", createdAt:now}));
    closeDlg(); toast(`Added ${pl(fresh.length, "special customer", "special customers")}`); });
  setTimeout(() => ta.focus(), 30);
}
function bulkDelCust() {
  const ids = [...UI.csel]; if (!ids.length) return;
  if (!confirm(`Remove ${pl(ids.length, "customer", "customers")} from special customers?`)) return;
  ids.forEach(id => delCust(id)); UI.csel.clear(); toast(`Removed ${pl(ids.length, "customer", "customers")}`);
}

function lineChart(pts) {
  if (pts.length < 2) return `<p class="empty-note">The chart appears after the second report import.</p>`;
  const W = 460, H = 200, L = 70, R = 12, T = 12, B = 26;
  const ys = pts.map(p => p.y), max = Math.max(...ys) * 1.08, min = Math.min(0, Math.min(...ys));
  const x = i => L + i * (W - L - R) / (pts.length - 1), y = v => T + (H - T - B) * (1 - (v - min) / (max - min || 1));
  const ticks = [0, .5, 1].map(f => min + (max - min) * f);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join("");
  const area = path + `L${x(pts.length - 1).toFixed(1)},${y(min)}L${x(0)},${y(min)}Z`;
  const step = Math.ceil(pts.length / 6);
  return `<div class="linechart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Open backlog value per import">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${eur0.format(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="3.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"><title>${esc(p.label)}: ${eur0.format(p.y)}, ${p.n} lines</title></circle>`).join("")}
    ${pts.map((p, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(p.short)}</text>` : "").join("")}
  </svg></div>`;
}

/* ---------- IMPORT ---------- */
const cleanStr = v => v == null ? "" : v instanceof Date ? isoLocal(v) : String(v).trim();
const toNum = v => typeof v === "number" ? v : (parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")) || 0);
function toDate(v) {
  if (v instanceof Date) return isoLocal(v);
  if (typeof v === "number" && window.XLSX) { const d = XLSX.SSF.parse_date_code(v); if (d) return d.y + "-" + pad(d.m) + "-" + pad(d.d); }
  const s = cleanStr(v);
  let m = /^(\d{4}-\d{2}-\d{2})/.exec(s); if (m) return m[1];
  m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/.exec(s); if (m) return m[3] + "-" + pad(m[2]) + "-" + pad(m[1]);
  return s;
}
function parseReport(buf) {
  if (!window.XLSX) throw new Error("the Excel library didn't load. Reload the page.");
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  const hi = rows.findIndex(r => r && r.some(c => typeof c === "string" && /^order\s*no/i.test(c.trim())));
  if (hi < 0) throw new Error('no "Order No." column found');
  const H = rows[hi].map(c => String(c ?? "").trim().toLowerCase());
  const col = (...n) => H.findIndex(h => n.some(x => h === x || h.startsWith(x)));
  const ci = {order:col("order no"), ref:col("your reference"), bu:col("business unit"), date:col("order date"), mpn:col("mpn", "item manufacturer"), cust:col("customer no"), rev:col("revenue"), com:col("comment")};
  if (ci.mpn < 0) throw new Error('no "MPN" column found');
  const out = new Map();
  for (const r of rows.slice(hi + 1)) {
    if (!r) continue;
    const orderNo = cleanStr(r[ci.order]);
    if (!orderNo || /^total$/i.test(orderNo)) continue;
    const mpn = cleanStr(r[ci.mpn]) || "—";
    const id = lineId(orderNo, mpn);
    const x = {id, orderNo, mpn, ref:ci.ref >= 0 ? cleanStr(r[ci.ref]) : "", bu:ci.bu >= 0 ? cleanStr(r[ci.bu]) : "", orderDate:ci.date >= 0 ? toDate(r[ci.date]) : "",
      customer:ci.cust >= 0 ? cleanStr(r[ci.cust]) : "", revenue:ci.rev >= 0 ? Math.round(toNum(r[ci.rev]) * 100) / 100 : 0, comment:ci.com >= 0 ? cleanStr(r[ci.com]) : ""};
    if (out.has(id)) out.get(id).revenue = Math.round((out.get(id).revenue + x.revenue) * 100) / 100; else out.set(id, x);
  }
  return {rows:[...out.values()], hasComment:ci.com >= 0};
}
function computeDiff(parsed) {
  const first = !(S.meta.imports || []).length && !S.lines.size;
  const inFile = new Set(parsed.rows.map(r => r.id));
  const added = [], returned = [], changed = [], same = [], gone = [];
  for (const r of parsed.rows) {
    const l = S.lines.get(r.id);
    if (!l) added.push(r);
    else if (l.state === "archived") returned.push({l, r});
    else if (Math.abs((l.revenue || 0) - r.revenue) > 0.005) changed.push({l, r});
    else same.push({l, r});
  }
  openLines().forEach(l => { if (!inFile.has(l.id) && l.inReport) gone.push(l); });
  const commentsIn = parsed.hasComment ? parsed.rows.filter(r => r.comment).length : 0;
  return {first, parsed, added, returned, changed, same, gone, commentsIn};
}
const base = r => ({orderNo:r.orderNo, mpn:r.mpn, ref:r.ref, bu:r.bu, orderDate:r.orderDate, customer:r.customer, revenue:r.revenue});
function showImport(d, fname) {

  const known = new Set([...S.lines.values()].map(l => l.orderNo));
  const addedOrders = new Set(d.added.filter(r => !known.has(r.orderNo)).map(r => r.orderNo)).size;
  const spNew = d.added.filter(r => special(r.customer)).length;
  openDlg(`<div class="dlg"><h2>Import: ${esc(fname)}</h2>
    <p>${pl(d.parsed.rows.length, "line", "lines")} in the file${d.parsed.hasComment ? `, ${d.commentsIn} with a comment (carried over wherever the line has no comment yet)` : ""}.
    ${d.first ? " This is the first import, so lines won't be flagged as New." : ""}${spNew && !d.first ? ` ${pl(spNew, "new line belongs", "new lines belong")} to special customers.` : ""}</p>
    <div class="ledger">

    isNew:!d.first, returned:false, inReport:true, missingSince:null, firstSeen:now, prevRevenue:null, revenueChangedAt:null,

  const imp = {at:now, file:fname, lines:d.parsed.rows.length, revenue:Math.round(d.parsed.rows.reduce((s, r) => s + r.revenue, 0)), added:d.added.length + d.returned.length, gone:d.gone.length, changed:d.changed.length};

async function handleFile(file) {

  if (!parsed.rows.length) { toast("The file has no order lines.", "err"); return; }
  showImport(computeDiff(parsed), file.name);
}

const BK_APP = "enterprise-order-desk";
const validId = x => x && typeof x === "object" && typeof x.id === "string" && /^[A-Za-z0-9_\-.~:@+]{1,190}$/.test(x.id);
function backupCounts(o) {
  return {open:o.lines.filter(l => l.state === "open").length, arch:o.lines.filter(l => l.state === "archived").length,
          wait:o.backorders.filter(b => b.state === "waiting").length, shipped:o.backorders.filter(b => b.state !== "waiting").length,
          custs:o.customers.length, imports:(o.meta?.imports || []).length};
}
const currentData = () => ({lines:[...S.lines.values()], backorders:[...S.backs.values()], customers:[...S.custs.values()], meta:S.meta});

  openDlg(`<div class="dlg"><h2>Backup</h2>

async function downloadBackup() {

async function readBackup(file) {
  let b;
  try { b = JSON.parse(await file.text()); } catch (e) { toast("This file isn't a valid backup (not JSON).", "err"); return; }
  if (!b || b.app !== BK_APP || !Array.isArray(b.lines)) { toast("This file isn't an Enterprise Order Desk backup.", "err"); return; }
  const bk = {
    lines:b.lines.filter(validId).filter(l => l.state === "open" || l.state === "archived"),
    backorders:(Array.isArray(b.backorders) ? b.backorders : []).filter(validId),
    customers:(Array.isArray(b.customers) ? b.customers : []).filter(validId).filter(c => c.customerNo),
    meta:b.meta && typeof b.meta === "object" && !Array.isArray(b.meta) ? b.meta : {}
  };
  const bc = backupCounts(bk), cc = backupCounts(currentData());
  const row = (l, a, x) => `<span>${l}</span><span class="n">${int.format(a)}</span><span class="n">${int.format(x)}</span>`;
  openDlg(`<form class="dlg" id="rF"><h2>Restore backup</h2>

      ${row("Open lines", bc.open, cc.open)}${row("Archived lines", bc.arch, cc.arch)}${row("Waiting for stock", bc.wait + bc.shipped, cc.wait + cc.shipped)}
      ${row("Special customers", bc.custs, cc.custs)}${row("Imports in history", bc.imports, cc.imports)}</div>
    <div class="radios">
      <label><input type="radio" name="m" value="merge" checked><span><b>Merge</b><br><span class="hint">Add everything from the backup. Items in both keep the backup version. Nothing already in the app is deleted.</span></span></label>
      <label><input type="radio" name="m" value="replace"><span><b>Replace everything</b><br><span class="hint">Make the app identical to the backup. Items that aren't in the backup are deleted.</span></span></label></div>
    <div class="progress" id="rProg" hidden><span></span></div>
    <div class="acts"><button class="btn" type="button" data-act="closeDlg" id="rCancel">Cancel</button><button class="btn primary" type="submit" id="rGo">Restore</button></div></form>`);
  $("#rF").addEventListener("submit", e => {
    e.preventDefault();
    const mode = new FormData(e.target).get("m");

}
async function applyBackup(bk, mode) {
  const jobs = [];
  const plan = (items, current, save, del) => {
    const ids = new Set(items.map(x => x.id));
    items.forEach(x => { const cur = current.get(x.id); if (!cur || JSON.stringify(cur) !== JSON.stringify(x)) jobs.push(() => save(clone(x))); });
    if (mode === "replace") [...current.keys()].forEach(id => { if (!ids.has(id)) jobs.push(() => del(id)); });
  };
  plan(bk.lines, S.lines, saveLine, delLine);
  plan(bk.backorders, S.backs, saveBack, delBack);
  plan(bk.customers, S.custs, saveCust, delCust);
  const btn = $("#rGo"), prog = $("#rProg"), bar = prog.firstElementChild;
  btn.disabled = true; $("#rCancel").disabled = true; prog.hidden = false;
  let done = 0, failed = 0;
  await Promise.all(jobs.map(j => j().then(() => {}, () => { failed++; }).finally(() => { done++; bar.style.width = (done / jobs.length * 100) + "%"; btn.textContent = `Restoring ${done}/${jobs.length}`; })));
  let meta;
  if (mode === "replace") meta = clone(bk.meta);
  else {
    const byAt = new Map([...(S.meta.imports || []), ...(bk.meta.imports || [])].filter(i => i && i.at).map(i => [i.at, i]));
    meta = {...clone(bk.meta), ...clone(S.meta), imports:[...byAt.values()].sort((a, b) => String(a.at).localeCompare(String(b.at))).slice(-365)};
    if (!Array.isArray(S.meta.templates) && Array.isArray(bk.meta.templates)) meta.templates = clone(bk.meta.templates);
  }
  await saveMeta(meta);
  closeDlg(); UI.shell = null; UI.sel.clear(); UI.csel.clear(); schedule();
  toast(failed ? `Restore partly done: ${failed} items couldn't be saved. Try again.` : jobs.length ? `Backup restored (${pl(jobs.length, "change", "changes")})` : "Nothing to change: the app already matches the backup", failed ? "err" : "");
}
